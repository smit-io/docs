baseURL: https://smitchoksi.com/
languageCode: en-us
title: Smit Choksi
theme: hextra
enableInlineShortcodes: true
enableInlineShortcodesInMarkdown: true
cleanDestinationDir: true

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: About
      pageRef: /about 
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: Github 
      weight: 5
      url: "https://github.com/smit-io/docs"
      params:
        icon: github
  sidebar:
    - name: More
      params:
        type: separator
      weight: 1
    - name: "About"
      pageRef: "/about"
      weight: 2
    - name: "Hugo Docs ↗"
      url: "https://gohugo.io/documentation/"
      weight: 3

params:
  theme:
    # light | dark | system
    default: system
    displayToggle: true
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo.svg
      link: /
      width: 40
      height: 20
  editURL:
    enable: true
    base: "https://github.com/smit-io/docs/edit/main"
  page:
    width: wide
  search:
    enable: true
    type: flexsearch
    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      tokenize: full
  highlight:
    copy:
      enable: true
      # hover | always
      display: hover
services:
  googleAnalytics:
    ID: G-9D1XJVP185

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
