baseURL: https://smitchoksi.com/
languageCode: en-us
title: Smit Choksi
theme: hextra
enableInlineShortcodes: true
enableInlineShortcodesInMarkdown: true
cleanDestinationDir: true

# Markdown/llms output formats — required by the page context menu below
# ("Copy page" / "Copy as Markdown" need a markdown output per page).
outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: About
      pageRef: /about 
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: Github 
      weight: 5
      url: "https://github.com/smit-io/docs"
      params:
        icon: github
  sidebar:
    - name: More
      params:
        type: separator
      weight: 1
    - name: "About"
      pageRef: "/about"
      weight: 2
    - name: "Hugo Docs ↗"
      url: "https://gohugo.io/documentation/"
      weight: 3

params:
  theme:
    # light | dark | system
    default: system
    displayToggle: true
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo.svg
      link: /
      width: 40
      height: 20
  editURL:
    enable: true
    base: "https://github.com/smit-io/docs/edit/main/smitchoksi.com/content"
  page:
    width: wide
    # Page context menu: "Copy page", "Copy as Markdown", "View as Markdown"
    # plus the custom links below. Flip enable to true to show it (also
    # needs the outputs: block at the top of this file).
    contextMenu:
      enable: false
      links:
        - name: Open in ChatGPT
          icon: chatgpt
          url: "https://chatgpt.com/?hints=search&q=I%27m+looking+at+this+documentation%3A+{url}%0AHelp+me+understand+how+to+use+it."
        - name: Open in Claude
          icon: claude
          url: "https://claude.ai/new?q=I%27m+looking+at+this+documentation%3A+{url}%0AHelp+me+understand+how+to+use+it."
  search:
    enable: true
    type: flexsearch
    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      tokenize: full
  highlight:
    copy:
      enable: true
      # hover | always
      display: hover
  fonts:
    # Enable Google Fonts integration
    enable: true
    heading:
      family: "Sora"
      axes: "wght@100..800"
      display: "swap"
    body:
      family: "Mozilla Text"
      axes: "wght@200..700"
      display: "swap"
    code:
      family: "Google Sans Code"
      axes: "ital,wght@0,300;1,300"
      display: "swap"
    # Fallback fonts (used if Google Fonts fail to load)
    fallbacks:
      heading: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      body: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      code: "ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace"

services:
  googleAnalytics:
    ID: G-9D1XJVP185

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
