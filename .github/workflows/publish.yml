name: publish

on:
  push:
    branches: [main]
  # Daily rebuild so future-dated posts go live once their date arrives
  # (Hugo skips date > now in production builds; the drafts build shows them).
  # GitHub cron caveats: UTC only, up to ~15 min start jitter, and GitHub
  # auto-disables the schedule after 60 days without repo activity.
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      # .gitmodules uses SSH URLs; rewrite to https+PAT so the theme
      # submodule clone AND the publish push work with one token on
      # both GitHub and act.
      - name: Configure git auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.PUBLISH_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global user.name "publish-bot"
          git config --global user.email "sgchoksi+publishbot@gmail.com"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify -s smitchoksi.com

      # public/ is plain build output (gitignored here). Publish it as a
      # single fresh commit force-pushed to the site repo — no artifact
      # history accumulates, and nothing is pushed back to this repo.
      - name: Publish to smit-io.github.io
        run: |
          cd smitchoksi.com/public
          git init -b main
          git remote add origin git@github.com:smit-io/smit-io.github.io.git
          git add -A
          git commit -m "publish: build from docs@${GITHUB_SHA:-local}"
          git push --force origin main
